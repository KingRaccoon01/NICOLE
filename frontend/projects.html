<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>NICOLE — Romanlar</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .projects-wrap { max-width: 900px; margin: 0 auto; padding: 40px 24px; }
  .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 24px; }
  .project-card {
    background: var(--ink-2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; cursor: pointer; transition: border-color .15s;
  }
  .project-card:hover { border-color: var(--gold); }
  .project-card .title { font-weight: 600; margin-bottom: 6px; }
  .project-card .meta { font-size: 12px; color: var(--paper-dim); }
  .new-project-row { display: flex; gap: 10px; margin-top: 24px; }
  .new-project-row input { flex: 1; padding: 10px 12px; background: var(--ink-3); border: 1px solid var(--border); color: var(--paper); border-radius: var(--radius); }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="logo">NICOLE</span>
    <span class="subtitle">書く・語る・創る</span>
  </div>
  <div class="header-actions">
    <a href="index.html" class="btn">← Editöre Dön</a>
  </div>
</header>

<div class="projects-wrap">
  <h2 style="margin:0;">Romanlar</h2>
  <p style="color:var(--paper-dim); font-size:13px;">Tüm projelerin listesi. Her romanın kendi Lore Sözlüğü vardır.</p>

  <div class="new-project-row">
    <input type="text" id="newProjectTitle" placeholder="Yeni roman/manga adı..." />
    <button class="btn btn-primary" id="newProjectBtn">+ Yeni Proje</button>
  </div>

  <div class="projects-grid" id="projectsGrid"></div>
</div>

<script src="js/api.js"></script>
<script src="js/projects.js"></script>
</body>
</html>
